name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # pdftotext (poppler) legge il testo dei PDF; i test lo usano sui PDF di esempio in fixtures/documenti/.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
