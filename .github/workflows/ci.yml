name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # poppler (pdftotext, pdftoppm) legge i PDF, tesseract con il modello italiano le scansioni;
      # i test li usano sui documenti di esempio in fixtures/documenti/.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-ita
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
